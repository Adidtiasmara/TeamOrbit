version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: teamorbit_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: teamorbit
      MYSQL_USER: teamorbit
      MYSQL_PASSWORD: teamorbit
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uteamorbit", "-pteamorbit"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamorbit_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_HOST: db
      DB_DATABASE: teamorbit
      DB_USERNAME: teamorbit
      DB_PASSWORD: teamorbit
    depends_on:
      db:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teamorbit_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    command: npm run dev

volumes:
  db_data:
