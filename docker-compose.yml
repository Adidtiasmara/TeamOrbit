# Jalankan seluruh aplikasi dari clone baru:
#   docker compose up --build
# Frontend: http://localhost:3000   API: http://localhost:8000/api
# Database, migrasi, dan akun demo disiapkan otomatis oleh container backend.
# Port di laptop bisa diganti lewat file .env di root repo (lihat .env.example).
name: teamorbit

services:
  db:
    image: mysql:8.4
    container_name: teamorbit_db
    restart: unless-stopped
    environment:
      # Kredensial khusus lingkungan dev lokal, bukan untuk produksi.
      MYSQL_DATABASE: teamorbit
      MYSQL_USER: teamorbit
      MYSQL_PASSWORD: teamorbit
      MYSQL_ROOT_PASSWORD: root
    # Dibuka hanya ke localhost dan bukan di 3306, supaya tidak bentrok dengan
    # MySQL lain di laptop (mis. Laragon). Backend memakai jaringan internal.
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Lewat TCP, bukan socket: server sementara saat inisialisasi pertama
      # tidak membuka TCP, jadi status sehat baru muncul saat siap dipakai.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    container_name: teamorbit_backend
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: teamorbit
      DB_USERNAME: teamorbit
      DB_PASSWORD: teamorbit
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
    container_name: teamorbit_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
